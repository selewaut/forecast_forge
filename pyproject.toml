[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-forge"
version = "0.0.1"
description = "Dataset-agnostic forecasting workflows."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Santiago Elewaut", email = "santielewaut@gmail.com" },
]
keywords = ["forecasting", "spark", "time-series"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "kaggle==1.6.17",
    "mlflow>=3.12,<4",
    "omegaconf==2.3.0",
    "pyarrow>=18.0.0",
    "pyspark>=4.1,<4.2",
    "sktime==0.34.0",
    "statsforecast==1.7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["forecast_forge", "forecast_forge.*"]

[tool.setuptools.package-data]
forecast_forge = ["*.yaml"]
